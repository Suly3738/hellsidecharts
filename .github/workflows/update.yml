name: Aktualizacja notowania

on:
  schedule:
    - cron: "7 * * * *" # co godzinę (kanał wrzuca ok. 20:00–21:00 PL; ~10 jednostek API na przebieg, limit 10 000/dzień)
  workflow_dispatch:
  push:
    branches: [main]

env:
  TZ: Europe/Warsaw

# Uprawnienia nadawane per job (zasada najmniejszych uprawnień): job z sekretem API
# może tylko pisać do repo, job publikujący stronę nie widzi sekretu ani nie pisze do repo.
permissions: {}

concurrency:
  group: hellsidecharts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Akcje przypięte do pełnego SHA (Dependabot podnosi je w PR-ach) – podmiana tagu u autora akcji nic nam nie zrobi.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: paczki npm nie uruchamiają własnych skryptów instalacyjnych (ochrona przed złośliwą zależnością)
      - run: npm ci --ignore-scripts

      - name: Pobierz dane i wygeneruj stronę
        run: node update.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: Zapisz historię notowań w repozytorium
        run: |
          git config user.name "hellsidecharts-bot"
          git config user.email "hellsidecharts-bot@users.noreply.github.com"
          git add data.json history.json index.html shorts-cache.json
          git diff --cached --quiet || git commit -m "Notowanie $(date +%Y-%m-%d)"
          git push

      - name: Przygotuj pliki strony
        run: |
          mkdir -p _site
          cp index.html data.json version.json logo.png _site/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
