# Dependabot: PR-y z aktualizacjami zależności npm i akcji GitHub (w tym poprawki bezpieczeństwa)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
